<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="404 — Page Not Found on ReadmeCraft. Return to the GitHub profile README builder.">
  <title>404 — Page Not Found | ReadmeCraft</title>
  <link rel="icon" type="image/png" href="assets/favicon_dark.png" id="app-favicon">
  <link rel="stylesheet" href="src/styles/tokens.css">
  <link rel="stylesheet" href="src/styles/base.css">
  <link rel="stylesheet" href="src/styles/layout.css">
  <link rel="stylesheet" href="src/styles/components.css">
  <style>
    .notfound-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-6);
    }
    .notfound-card {
      max-width: 480px;
      width: 100%;
      background-color: var(--color-bg-surface);
      border: 1px solid var(--color-border-default);
      border-radius: var(--radius-lg);
      padding: var(--space-8);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
      text-align: center;
    }
    .notfound-code {
      font-family: var(--font-mono);
      font-size: var(--font-size-2xl);
      font-weight: 700;
      color: var(--color-accent);
      letter-spacing: -0.02em;
    }
    .notfound-links {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      margin-top: var(--space-2);
    }
  </style>
</head>
<body>
  <div class="app-root">
    <header class="app-header" role="banner">
      <a href="index.html" class="header-brand" aria-label="ReadmeCraft Home">
        <img src="assets/horizontal_lockup_white.png" alt="ReadmeCraft" class="brand-logo brand-logo--light" height="24">
        <img src="assets/horizontal_lockup_dark.png" alt="ReadmeCraft" class="brand-logo brand-logo--dark" height="24">
        <span class="brand-tag">v1</span>
      </a>

      <div class="header-actions">
        <button id="theme-toggle" class="btn btn--icon btn--subtle" title="Toggle theme" aria-label="Toggle theme">
          <svg id="theme-icon" width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM8 0a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0V.75A.75.75 0 0 1 8 0zm0 13a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0v-1.5A.75.75 0 0 1 8 13zM2.343 2.343a.75.75 0 0 1 1.061 0l1.06 1.061a.75.75 0 0 1-1.06 1.06l-1.06-1.06a.75.75 0 0 1 0-1.06zm9.193 9.193a.75.75 0 0 1 1.06 0l1.061 1.06a.75.75 0 0 1-1.06 1.061l-1.061-1.06a.75.75 0 0 1 0-1.061zM0 8a.75.75 0 0 1 .75-.75h1.5a.75.75 0 0 1 0 1.5H.75A.75.75 0 0 1 0 8zm13 0a.75.75 0 0 1 .75-.75h1.5a.75.75 0 0 1 0 1.5h-1.5A.75.75 0 0 1 13 8zM2.343 13.657a.75.75 0 0 1 0-1.06l1.06-1.061a.75.75 0 1 1 1.062 1.06l-1.061 1.061a.75.75 0 0 1-1.061 0zm9.193-9.193a.75.75 0 0 1 0-1.06l1.06-1.061a.75.75 0 1 1 1.062 1.06l-1.061 1.061a.75.75 0 0 1-1.061 0z"/>
          </svg>
        </button>
        <a href="index.html" class="btn btn--primary">Return Home</a>
      </div>
    </header>

    <main class="notfound-container">
      <div class="notfound-card">
        <div class="notfound-code">404</div>
        <h1 style="font-size: var(--font-size-lg);">Page or Branch Not Found</h1>
        <p style="color: var(--color-text-secondary); font-size: var(--font-size-sm);">
          The requested URL does not exist. Check spelling or return to the main README builder workbench.
        </p>

        <div class="notfound-links">
          <a href="index.html" class="btn btn--primary">Open ReadmeCraft Editor</a>
          <a href="privacy.html" class="btn btn--subtle">View Privacy Policy</a>
        </div>
      </div>
    </main>

    <footer class="app-footer" role="contentinfo">
      <div class="footer-inner">
        <div class="footer-col">
          <div style="display: flex; align-items: center; gap: 8px;">
            <img src="assets/icon_white.png" alt="ReadmeCraft" width="22" height="22" style="border-radius: 4px;">
            <span style="font-weight: 600; font-size: 14px;">ReadmeCraft</span>
          </div>
        </div>
        <div class="footer-links">
          <a href="privacy.html">Privacy Policy</a>
          <a href="terms.html">Terms of Service</a>
          <a href="cookies.html">Cookie Policy</a>
          <a href="index.html">Editor</a>
        </div>
      </div>
      <div class="footer-bottom">
        <span>&copy; <span id="copyright-year">2026</span> ReadmeCraft. MIT Licensed.</span>
      </div>
    </footer>
  </div>
  <script src="src/ui/theme.js" type="module"></script>
</body>
</html>
